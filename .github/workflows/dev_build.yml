name: Dev build

# Each merge to master makes a dev build on the run page. Download it to try it
# on another machine. The till never installs it: it reads only GitHub Releases.
on:
  push:
    branches: [master]

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  package:
    needs: [test]
    uses: ./.github/workflows/package.yml
    with:
      version: dev
      retention-days: 14
