name: Electron CI

on:
  push:
    branches: [master]
    # A v* tag also publishes a GitHub Release. The till installs it (deploy/xapp-update.sh).
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release tag must be on master, as in ksg-nett and ksg-nett-frontend.
      - name: Check that the tag is on master
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Yarn 4.18.1 from packageManager in package.json
      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Ubuntu 24.04 blocks the unprivileged user namespaces that Chromium's
      # sandbox needs. See README.md → "Ubuntu sandbox".
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run end-to-end tests
        run: xvfb-run --auto-servernum yarn test
        env:
          CI: true

      # The packaged app takes its version from package.json. A release sets it
      # from the tag (v2026.10.3 -> 2026.10.3), so nothing is committed.
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build the Linux package
        run: yarn build-linux

      - name: Test the update script
        run: sudo deploy/test-update.sh

      - name: Pack the Linux release
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then tag="dev-${GITHUB_SHA::7}"; fi
          asset="xapp-linux-x64-$tag.tar.gz"
          tar -czf "$asset" -C release-builds X-App-linux-x64
          tar -tzf "$asset" X-App-linux-x64/X-App X-App-linux-x64/chrome-sandbox
          sha256sum "$asset" > "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      # A dev build to download from the run page. The till never installs it.
      - name: Upload the dev build
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          retention-days: 14

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
