name: Electron CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Ubuntu 24.04 blocks the unprivileged user namespaces that Chromium's
      # sandbox needs. See README.md → "Ubuntu sandbox".
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run end-to-end tests
        run: xvfb-run --auto-servernum yarn test
        env:
          CI: true

      - name: Build the Linux package
        run: yarn build-linux
