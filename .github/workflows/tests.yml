name: Tests

# Reused by test_on_pr.yml, dev_build.yml and release.yml.
on: [workflow_call]

jobs:
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          # Yarn comes from corepack later. No automatic cache from packageManager.
          package-manager-cache: false
          node-version-file: .nvmrc

      # Yarn 4 comes from packageManager in package.json.
      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Ubuntu 24.04 blocks the unprivileged user namespaces that Chromium's
      # sandbox needs. See README.md → "Ubuntu sandbox".
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Playwright starts the app against test/fakeApi.js. xvfb gives it a display.
      - name: Run the Playwright tests
        run: xvfb-run --auto-servernum yarn test
        env:
          CI: true

  update-script:
    name: Update script test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Installs fake releases from a fake GitHub API on localhost. Needs root,
      # like on the till, to set the owner of chrome-sandbox.
      - name: Test deploy/xapp-update.sh
        run: sudo deploy/test-update.sh
