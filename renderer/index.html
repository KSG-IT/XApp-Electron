<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <!-- Mantine sets CSS variables in a <style> tag, so style-src needs
         'unsafe-inline'. Scripts come only from the build. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>X-App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
