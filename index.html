<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Login</title>
    <script src="assets/js/api.js"></script>

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.css"
    />

    <!-- Custom styles for this template -->
    <link href="assets/css/floating-labels.css" rel="stylesheet" />
    <link href="assets/css/animations.css" rel="stylesheet" />
  </head>
  <body>
    <form id="loginForm" class="form-signin" style="user-select: none;">
      <div class="text-center mb-4">
        <img
          id="ksg-logo"
          class="mb-4"
          src="assets/images/ksg-logo-white-on-black.png"
          alt=""
          width="150"
          height="150"
          style="border-radius: 50%;"
        />
        <h1 class="h3 mb-3 font-weight-normal">X-App</h1>
        <p>Vennligst skann kortet ditt for å åpne Soci.</p>
        <input name="cardNumber" type="hidden" id="cardNumberInput" required />
        <p id="loginOutput" data-testid="login-output" style="color: deeppink;"></p>
      </div>
    </form>
  </body>
</html>
<script type="text/javascript">
  // productView.html sends us here with #expired when the token has expired.
  if (window.location.hash === "#expired") {
    document.getElementById("loginOutput").innerText =
      "Økten er utløpt. Skann kortet for å åpne Soci igjen.";
  }

  // Takes card reader and appends it to the hidden card number input field.
  document.onkeydown = function (event) {
    if (event.key === "Enter") {
      const loginForm = document.getElementById("loginForm");
      obtainAuthenticationToken(loginForm);
      loginForm.cardNumber.value = "";
      setTimeout(() => {
        document.getElementById("loginOutput").innerText = "";
      }, 3000);
    } else {
      document.getElementById("cardNumberInput").value += event.key;
    }
  };
</script>
